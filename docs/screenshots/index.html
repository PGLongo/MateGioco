<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MateGioco - Galleria schermate</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f6f8; --panel: #fff; --ink: #1f2933; --muted: #6b7785; --line: #e1e6ea; --accent: #4F9BCC; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1f23; --panel: #24292e; --ink: #e8eef4; --muted: #9aa5b1; --line: #333a41; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 10; }
  h1 { margin: 0 0 4px; font-size: 1.2rem; }
  .meta { color: var(--muted); font-size: .85rem; }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .controls label { font-size: .85rem; color: var(--muted); }
  select, button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  main { padding: 24px; display: flex; flex-direction: column; gap: 40px; }
  section h2 { font-size: 1.05rem; margin: 0 0 4px; }
  section .hint { color: var(--muted); font-size: .85rem; margin: 0 0 16px; }
  .row { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 8px; }
  figure { margin: 0; flex: 0 0 auto; }
  figure img { display: block; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); max-width: none; }
  figcaption { margin-top: 8px; font-size: .8rem; color: var(--muted); text-align: center; }
  figcaption strong { display: block; color: var(--ink); font-size: .85rem; }
  .zoom-50 figure img { transform-origin: top left; }
</style>
</head>
<body>
<header>
  <h1>MateGioco - Galleria schermate</h1>
  <div class="meta">Generata da <code>npm run screenshots</code>. Non modificare a mano: rigenerala.</div>
  <div class="controls">
    <label>Tema
      <select id="tema">
        <option value="light">chiaro</option>
        <option value="dark">scuro (solo dispositivo di riferimento)</option>
      </select>
    </label>
    <label>Scala
      <select id="scala">
        <option value="1">100%</option>
        <option value="0.6" selected>60%</option>
        <option value="0.4">40%</option>
      </select>
    </label>
  </div>
</header>
<main>
  <section data-screen="home">
    <h2>Home</h2>
    <p class="hint"><code>/</code></p>
    <div class="row">
      <figure data-theme-light="iphone-se/home.png" data-theme-dark="">
        <img src="iphone-se/home.png" width="375" height="667" alt="Home su iPhone SE" loading="lazy">
        <figcaption><strong>iPhone SE</strong>375x667<br>SE 2/3, 6, 7, 8</figcaption>
      </figure>
      <figure data-theme-light="iphone-13-mini/home.png" data-theme-dark="">
        <img src="iphone-13-mini/home.png" width="375" height="812" alt="Home su iPhone 13 mini" loading="lazy">
        <figcaption><strong>iPhone 13 mini</strong>375x812<br>X, XS, 11 Pro, 12/13 mini</figcaption>
      </figure>
      <figure data-theme-light="iphone-14/home.png" data-theme-dark="">
        <img src="iphone-14/home.png" width="390" height="844" alt="Home su iPhone 14" loading="lazy">
        <figcaption><strong>iPhone 14</strong>390x844<br>12, 13, 14</figcaption>
      </figure>
      <figure data-theme-light="iphone-16/home.png" data-theme-dark="iphone-16/home-dark.png">
        <img src="iphone-16/home.png" width="393" height="852" alt="Home su iPhone 16" loading="lazy">
        <figcaption><strong>iPhone 16</strong>393x852<br>14 Pro, 15, 16</figcaption>
      </figure>
      <figure data-theme-light="iphone-16-pro/home.png" data-theme-dark="">
        <img src="iphone-16-pro/home.png" width="402" height="874" alt="Home su iPhone 16 Pro" loading="lazy">
        <figcaption><strong>iPhone 16 Pro</strong>402x874<br>16 Pro</figcaption>
      </figure>
      <figure data-theme-light="iphone-11/home.png" data-theme-dark="">
        <img src="iphone-11/home.png" width="414" height="896" alt="Home su iPhone 11" loading="lazy">
        <figcaption><strong>iPhone 11</strong>414x896<br>XR, XS Max, 11</figcaption>
      </figure>
      <figure data-theme-light="iphone-14-plus/home.png" data-theme-dark="">
        <img src="iphone-14-plus/home.png" width="428" height="926" alt="Home su iPhone 14 Plus" loading="lazy">
        <figcaption><strong>iPhone 14 Plus</strong>428x926<br>12/13 Pro Max, 14 Plus</figcaption>
      </figure>
      <figure data-theme-light="iphone-15-pro-max/home.png" data-theme-dark="">
        <img src="iphone-15-pro-max/home.png" width="430" height="932" alt="Home su iPhone 15 Pro Max" loading="lazy">
        <figcaption><strong>iPhone 15 Pro Max</strong>430x932<br>15 Pro Max, 16 Plus</figcaption>
      </figure>
      <figure data-theme-light="iphone-16-pro-max/home.png" data-theme-dark="">
        <img src="iphone-16-pro-max/home.png" width="440" height="956" alt="Home su iPhone 16 Pro Max" loading="lazy">
        <figcaption><strong>iPhone 16 Pro Max</strong>440x956<br>16 Pro Max</figcaption>
      </figure>
    </div>
  </section>

        <figcaption><strong>iPhone 16 Pro Max</strong>440x956<br>16 Pro Max</figcaption>

    </div>
  </section>

      </figure>

  </section>
  <section data-screen="badges">

      </figure>
    </div>
  </section>
</main>
<script>
  const tema = document.getElementById('tema')
  const scala = document.getElementById('scala')

  const applica = () => {
    const t = tema.value
    const s = Number(scala.value)
    for (const fig of document.querySelectorAll('figure')) {
      const src = fig.dataset['theme' + t.charAt(0).toUpperCase() + t.slice(1)]
      const img = fig.querySelector('img')
      // in tema scuro esiste solo il dispositivo di riferimento: gli altri restano chiari
      img.src = src || fig.dataset.themeLight
      img.style.width = (img.getAttribute('width') * s) + 'px'
      img.style.height = 'auto'
    }
  }

  tema.addEventListener('change', applica)
  scala.addEventListener('change', applica)
  applica()
</script>
</body>
</html>
